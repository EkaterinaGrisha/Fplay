<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Профсила — старт</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;background:#141033}
a{color:#D7FF45}a:hover{color:#EEFFB0}
.press{transition:transform .14s cubic-bezier(.3,1.5,.6,1),box-shadow .14s ease}
.press:hover{transform:translateY(-2px)}
.press:active{transform:translateY(4px) scale(.98)}
.cta{box-shadow:0 6px 0 #8FAE14}
.cta:active{box-shadow:0 2px 0 #8FAE14}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.bob{animation:bob 3.4s ease-in-out infinite}
.bob2{animation:bob 4.2s ease-in-out .6s infinite}
.bob3{animation:bob 3.8s ease-in-out 1.2s infinite}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0)}50%{opacity:.35;transform:scale(.6) rotate(45deg)}}
.tw{animation:twinkle 2.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.tw2{animation:twinkle 3.1s ease-in-out .9s infinite;transform-origin:center;transform-box:fill-box}
@media (prefers-reduced-motion:reduce){.bob,.bob2,.bob3,.tw,.tw2{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 22px 24px 22px; display: flex; flex-direction: column; gap: 16px; background: #141033; color: #FFFFFF; font-family: Onest, system-ui, sans-serif; overflow: hidden">

  <div style="position: relative; display: flex; align-items: center; gap: 12px; border-radius: 12px; outline: {{slot}}; outline-offset: 4px">
    <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; border: 2px dashed #6E64B8; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; letter-spacing: .04em; color: #B8B1E8">ЛОГО</div>
    <p style="margin: 0; font-size: 12px; line-height: 1.35; color: #B8B1E8">Кафедра экономики и экономической безопасности<br>Социально-экономический институт</p>
    <sc-if value="{{showSlots}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: -12px; right: -6px; padding: 2px 8px; border-radius: 999px; background: #D7FF45; color: #141033; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase">заменить</span></sc-if>
  </div>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center">
    <div style="position: relative; width: 342px; height: 384px">

      <div style="position: absolute; left: 0; top: 10px; transform: rotate(-8deg)"><img class="bob" src="avatars/a01.svg" alt="" style="display: block; width: 84px; height: 84px; border-radius: 50%; border: 4px solid #141033"></div>
      <div style="position: absolute; left: 136px; top: 18px; transform: rotate(5deg)"><img class="bob3" src="avatars/a17.svg" alt="" style="display: block; width: 58px; height: 58px; border-radius: 50%; border: 4px solid #141033"></div>
      <div style="position: absolute; right: 0; top: 0; transform: rotate(7deg)"><img class="bob2" src="avatars/a10.svg" alt="" style="display: block; width: 96px; height: 96px; border-radius: 50%; border: 4px solid #141033"></div>
      <div style="position: absolute; left: -12px; top: 214px; transform: rotate(10deg)"><img class="bob2" src="avatars/a04.svg" alt="" style="display: block; width: 62px; height: 62px; border-radius: 50%; border: 4px solid #141033"></div>
      <div style="position: absolute; right: -12px; top: 150px; transform: rotate(-6deg)"><img class="bob" src="avatars/a24.svg" alt="" style="display: block; width: 68px; height: 68px; border-radius: 50%; border: 4px solid #141033"></div>

      <svg width="342" height="384" viewBox="0 0 342 384" aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
        <path class="tw" d="M106 86 Q107.5 96.5 118 98 Q107.5 99.5 106 110 Q104.5 99.5 94 98 Q104.5 96.5 106 86 Z" fill="#D7FF45"></path>
        <path class="tw2" d="M226 98 Q227 105 234 106 Q227 107 226 114 Q225 107 218 106 Q225 105 226 98 Z" fill="#FF5FA2"></path>
        <path class="tw2" d="M24 128 Q25 134 31 135 Q25 136 24 142 Q23 136 17 135 Q23 134 24 128 Z" fill="#3DDC97"></path>
        <path class="tw" d="M300 300 Q301.5 309.5 311 311 Q301.5 312.5 300 322 Q298.5 312.5 289 311 Q298.5 309.5 300 300 Z" fill="#B285FF"></path>
        <circle cx="40" cy="340" r="5" fill="#FF9F40"></circle>
        <circle cx="318" cy="250" r="4" fill="#4C7DFF"></circle>
      </svg>

      <div style="position: absolute; left: 0; right: 0; top: 104px; display: flex; flex-direction: column; align-items: center; text-align: center">
        <p style="margin: 0 0 12px; padding: 6px 12px; border-radius: 999px; background: #2D2566; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #E4E0FF">игра-профориентация</p>
        <h1 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 74px; line-height: .94; letter-spacing: -.02em; color: #FFFFFF">ПРОФ<br><span style="color: #D7FF45">СИЛА</span></h1>
        <p style="margin: 18px 0 0; max-width: 260px; font-size: 17px; line-height: 1.4; color: #E4E0FF">Пройди 12 жизненных ситуаций и узнай свою профессию-суперсилу</p>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <p style="margin: 0; font-size: 14px; font-weight: 600; color: #B8B1E8">Сколько у тебя времени?</p>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
        <button class="press" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="height: 76px; padding: 0; border-radius: 18px; border: 2px solid {{m.bd}}; background: {{m.bg}}; color: {{m.fg}}; font-family: Onest, sans-serif; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
          <span style="font-family: Unbounded, sans-serif; font-weight: 700; font-size: 20px; line-height: 1">{{m.time}}</span>
          <span style="font-size: 12px; font-weight: 600">мин · {{m.name}}</span>
        </button>
      </sc-for>
    </div>
    <p aria-live="polite" style="margin: 0; min-height: 18px; font-size: 13px; color: #B8B1E8">{{modeDesc}}</p>
  </div>

  <a href="Character.dc.html" class="press cta" style="height: 68px; border-radius: 22px; background: #D7FF45; color: #141033; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 24px">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"></path></svg>
    Играть
  </a>

  <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
    <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #B8B1E8">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      Без регистрации и сбора данных
    </span>
    <a href="Projector.dc.html" style="min-height: 44px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #D7FF45; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
      Для проектора
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showSlots":{"editor":"boolean","default":true,"section":"Макет"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'std' };
  }
  renderVals() {
    const show = this.props.showSlots ?? true;
    const list = [
      { id: 'blitz', time: '5–7', name: 'блиц', desc: '10 ситуаций · быстрый темп' },
      { id: 'std', time: '15', name: 'стандарт', desc: '12 ситуаций · с подсказками о профессиях' },
      { id: 'deep', time: '30–40', name: 'глубоко', desc: '12 ситуаций · разбор и обсуждение каждой профессии' }
    ];
    const modes = list.map((m) => {
      const on = m.id === this.state.mode;
      return {
        ...m,
        on,
        bg: on ? '#D7FF45' : '#211A4D',
        fg: on ? '#141033' : '#FFFFFF',
        bd: on ? '#D7FF45' : '#3E357D',
        pick: () => this.setState({ mode: m.id })
      };
    });
    const cur = list.find((m) => m.id === this.state.mode) || list[1];
    return {
      modes,
      modeDesc: cur.desc,
      showSlots: show,
      slot: show ? '2px dashed rgba(215,255,69,.8)' : '2px dashed transparent'
    };
  }
}
</script>
</body>
</html>
