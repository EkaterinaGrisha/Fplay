<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Профсила — выбор персонажа</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;background:#141033}
a{color:#D7FF45}a:hover{color:#EEFFB0}
.press{transition:transform .14s cubic-bezier(.3,1.5,.6,1),box-shadow .14s ease}
.press:hover{transform:translateY(-2px)}
.press:active{transform:translateY(4px) scale(.98)}
.press:disabled{opacity:.6;cursor:default;transform:none}
.cta{box-shadow:0 6px 0 #8FAE14}
.cta:active{box-shadow:0 2px 0 #8FAE14}
@keyframes reelspin{0%{transform:translateY(-14px)}50%{transform:translateY(14px)}100%{transform:translateY(-14px)}}
.spin{animation:reelspin .16s linear infinite;filter:blur(2px)}
@keyframes land{0%{transform:translateY(-26px) scale(.86)}55%{transform:translateY(6px) scale(1.06)}100%{transform:translateY(0) scale(1)}}
.land{animation:land .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.bulb-a{animation:blink 1.2s steps(1) infinite}
.bulb-b{animation:blink 1.2s steps(1) .6s infinite}
.bulb-a.fast,.bulb-b.fast{animation-duration:.24s}
@keyframes burst{0%{transform:translateY(0) scale(.2);opacity:1}70%{opacity:1}100%{transform:translateY(-118px) scale(1);opacity:0}}
.piece{animation:burst .9s cubic-bezier(.2,.8,.4,1) forwards}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.45}}
.nick-spin{animation:flick .16s linear infinite}
@keyframes leverpull{0%{transform:rotate(0)}30%{transform:rotate(34deg)}100%{transform:rotate(0)}}
.lever{transform-origin:50% 100%}
.lever.pull{animation:leverpull .7s ease-out}
@media (prefers-reduced-motion:reduce){.spin,.land,.bulb-a,.bulb-b,.piece,.nick-spin,.lever.pull{animation:none;filter:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 18px 24px 24px; display: flex; flex-direction: column; gap: 18px; background: #141033; color: #FFFFFF; font-family: Onest, system-ui, sans-serif; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <a href="Main.dc.html" aria-label="Назад" class="press" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: #211A4D; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 18px">Кто ты сегодня?</h1>
    <span style="width: 44px"></span>
  </div>

  <div style="position: relative; align-self: center; width: 316px; box-sizing: border-box; padding: 16px 18px; border-radius: 34px; background: #211A4D; border: 3px solid #3E357D; display: flex; flex-direction: column; align-items: center; gap: 14px">
    <div style="display: flex; justify-content: space-between; width: 100%">
      <sc-for list="{{bulbsTop}}" as="b" hint-placeholder-count="9">
        <span class="{{b.cls}}" style="width: 12px; height: 12px; border-radius: 50%; background: {{b.c}}"></span>
      </sc-for>
    </div>

    <div style="position: relative; width: 236px; height: 262px; border-radius: 26px; background: #0E0A26; overflow: hidden; border: 3px solid #0B0820">
      <div class="{{reelCls}}" style="position: absolute; left: 0; right: 0; top: -172px; display: flex; flex-direction: column; align-items: center; gap: 20px">
        <img src="{{prev}}" alt="" style="width: 186px; height: 186px; opacity: .45">
        <img src="{{cur}}" alt="{{curAlt}}" style="width: 186px; height: 186px">
        <img src="{{next}}" alt="" style="width: 186px; height: 186px; opacity: .45">
      </div>
      <svg width="236" height="262" viewBox="0 0 236 262" aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
        <path d="M0 119 L13 131 L0 143 Z" fill="#D7FF45"></path>
        <path d="M236 119 L223 131 L236 143 Z" fill="#D7FF45"></path>
      </svg>
      <sc-if value="{{landed}}" hint-placeholder-val="{{ true }}">
        <div aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none">
          <sc-for list="{{pieces}}" as="p" hint-placeholder-count="10">
            <div style="position: absolute; left: 0; top: 0; transform: rotate({{p.a}}deg)">
              <span class="piece" style="position: absolute; left: -5px; top: -5px; width: {{p.w}}px; height: {{p.h}}px; border-radius: {{p.r}}; background: {{p.c}}; animation-delay: {{p.d}}s"></span>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; justify-content: space-between; width: 100%">
      <sc-for list="{{bulbsBottom}}" as="b" hint-placeholder-count="9">
        <span class="{{b.cls}}" style="width: 12px; height: 12px; border-radius: 50%; background: {{b.c}}"></span>
      </sc-for>
    </div>

    <svg class="{{leverCls}}" width="26" height="110" viewBox="0 0 26 110" aria-hidden="true" style="position: absolute; right: -24px; top: 92px">
      <rect x="10" y="18" width="6" height="84" rx="3" fill="#B8B1E8"></rect>
      <circle cx="13" cy="13" r="12" fill="#FF5FA2"></circle>
      <circle cx="9" cy="9" r="3.5" fill="#FFFFFF" opacity=".6"></circle>
      <rect x="2" y="96" width="22" height="14" rx="5" fill="#3E357D"></rect>
    </svg>
  </div>

  <div aria-live="polite" style="text-align: center; display: flex; flex-direction: column; gap: 8px">
    <p style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #B8B1E8">Твой ник</p>
    <p class="{{nickCls}}" style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.12; color: #FFFFFF"><span style="color: #D7FF45">{{adj}}</span><br>{{noun}}</p>
  </div>

  <p style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; line-height: 1.35; color: #B8B1E8; text-align: center">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
    Персонаж выпадает случайно и не влияет на результат
  </p>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <button class="press" onClick="{{reroll}}" disabled="{{spinning}}" style="height: 56px; border-radius: 18px; border: 2px solid #4A4190; background: #2D2566; color: #FFFFFF; font-family: Onest, sans-serif; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"></circle><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"></circle><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"></circle><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor"></circle></svg>
      Другой персонаж
    </button>
    <a href="Situation.dc.html" class="press cta" style="height: 64px; border-radius: 20px; background: #D7FF45; color: #141033; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px">
      Поехали
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const AV_NAMES = ['Лиса в наушниках', 'Енот в шапке', 'Панда в очках-звёздах', 'Кот в панаме', 'Сова в шарфе', 'Медведь в кепке', 'Зайка с бантом', 'Пингвин в гоглах', 'Лягушка в короне', 'Аксолотль в очках-сердечках', 'Капибара в бандане', 'Ленивец с маской для сна', 'Дракончик в очках', 'Единорог с цветком', 'Йети в меховых наушниках', 'Привидение в колпаке', 'Пришелец в тёмных очках', 'Циклоп в кепке с пропеллером', 'Осьминог в бескозырке', 'Ёжик в венке', 'Тигрёнок с повязкой', 'Коала с жвачкой', 'Слайм с вишенкой', 'Фениксёнок с наушниками'];
const ADJ = ['Смелый', 'Хитрый', 'Неутомимый', 'Весёлый', 'Спокойный', 'Дерзкий', 'Мудрый', 'Быстрый', 'Сияющий', 'Загадочный', 'Отважный', 'Внимательный'];
const NOUN = ['Аналитик', 'Стратег', 'Исследователь', 'Изобретатель', 'Навигатор', 'Комбинатор', 'Мечтатель', 'Капитан', 'Тактик', 'Первопроходец', 'Архитектор', 'Сыщик'];
const BULB = ['#FF9F40', '#3DDC97', '#FF5FA2', '#4C7DFF', '#B285FF', '#D7FF45'];
const PIECE = ['#D7FF45', '#FF5FA2', '#3DDC97', '#FF9F40', '#4C7DFF', '#B285FF'];
const src = (i) => 'avatars/a' + String(((i % 24) + 24) % 24 + 1).padStart(2, '0') + '.svg';

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, a: 0, n: 0, spinning: false, rolls: 0 };
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  reroll() {
    if (this.state.spinning) return;
    let ticks = 0;
    this.setState({ spinning: true });
    this.timer = setInterval(() => {
      ticks += 1;
      const s = this.state;
      if (ticks < 16) {
        this.setState({ i: (s.i + 1) % 24, a: (s.a + 1) % ADJ.length, n: (s.n + 1) % NOUN.length });
      } else {
        clearInterval(this.timer);
        let next = Math.floor(Math.random() * 24);
        if (next === s.i) next = (next + 7) % 24;
        this.setState({
          i: next,
          a: Math.floor(Math.random() * ADJ.length),
          n: Math.floor(Math.random() * NOUN.length),
          spinning: false,
          rolls: s.rolls + 1
        });
      }
    }, 70);
  }
  renderVals() {
    const s = this.state;
    const bulbs = (offset) => Array.from({ length: 9 }, (_, k) => ({
      c: BULB[(k + offset) % BULB.length],
      cls: (k % 2 ? 'bulb-a' : 'bulb-b') + (s.spinning ? ' fast' : '')
    }));
    const pieces = Array.from({ length: 12 }, (_, k) => ({
      a: k * 30 + 8,
      c: PIECE[k % PIECE.length],
      w: k % 3 === 0 ? 14 : 10,
      h: k % 3 === 0 ? 6 : 10,
      r: k % 2 ? '50%' : '3px',
      d: (k % 4) * 0.03
    }));
    return {
      prev: src(s.i - 1),
      cur: src(s.i),
      next: src(s.i + 1),
      curAlt: 'Твой персонаж: ' + AV_NAMES[s.i],
      adj: ADJ[s.a],
      noun: NOUN[s.n],
      spinning: s.spinning,
      landed: !s.spinning,
      reelCls: s.spinning ? 'spin' : 'land',
      nickCls: s.spinning ? 'nick-spin' : '',
      leverCls: s.spinning ? 'lever pull' : 'lever',
      bulbsTop: bulbs(0),
      bulbsBottom: bulbs(3),
      pieces,
      reroll: () => this.reroll()
    };
  }
}
</script>
</body>
</html>
