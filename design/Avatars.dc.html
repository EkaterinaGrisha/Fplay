<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Профсила — 24 персонажа</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F4F1FF}
.av{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.av:hover{transform:translateY(-6px) rotate(-4deg)}
@media (prefers-reduced-motion:reduce){.av:hover{transform:none}}
</style>
</helmet>
<div style="width: 1800px; height: 940px; box-sizing: border-box; padding: 56px 64px; display: flex; flex-direction: column; gap: 36px; background: #F4F1FF; color: #141033; font-family: Onest, system-ui, sans-serif">
  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 40px">
    <div>
      <h1 style="margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.1">24 персонажа</h1>
      <p style="margin: 10px 0 0; font-size: 17px; color: #2A2450">Выпадают случайно и никак не связаны с результатом — это просто стиль игрока.</p>
    </div>
    <p style="margin: 0; padding: 10px 16px; border-radius: 14px; background: #FFFFFF; box-shadow: inset 0 0 0 2px #E4DFFA; font-size: 14px; color: #4E4878; white-space: nowrap">Файлы: <span style="color: #141033; font-weight: 600">avatars/a01.svg … a24.svg</span> · 240×240 · без фото</p>
  </div>
  <ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); column-gap: 24px; row-gap: 28px">
    <sc-for list="{{avatars}}" as="a" hint-placeholder-count="24">
      <li style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
        <img class="av" src="{{a.src}}" alt="{{a.name}}" style="width: 150px; height: 150px">
        <span style="font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #5B2FD6">{{a.n}}</span>
        <span style="font-size: 13px; line-height: 1.3; color: #2A2450; max-width: 170px">{{a.name}}</span>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1800,"height":940}}'>
const NAMES = ['Лиса в наушниках', 'Енот в шапке', 'Панда в очках-звёздах', 'Кот в панаме', 'Сова в шарфе', 'Медведь в кепке', 'Зайка с бантом', 'Пингвин в гоглах', 'Лягушка в короне', 'Аксолотль в очках-сердечках', 'Капибара в бандане', 'Ленивец с маской для сна', 'Дракончик в очках', 'Единорог с цветком', 'Йети в меховых наушниках', 'Привидение в колпаке', 'Пришелец в тёмных очках', 'Циклоп в кепке с пропеллером', 'Осьминог в бескозырке', 'Ёжик в венке', 'Тигрёнок с повязкой', 'Коала с жвачкой', 'Слайм с вишенкой', 'Фениксёнок с наушниками'];

class Component extends DCLogic {
  renderVals() {
    const avatars = NAMES.map((name, k) => {
      const n = String(k + 1).padStart(2, '0');
      return { n, name, src: 'avatars/a' + n + '.svg' };
    });
    return { avatars };
  }
}
</script>
</body>
</html>
