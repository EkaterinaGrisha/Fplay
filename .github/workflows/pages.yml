# Публикация игры на GitHub Pages: https://profsila.github.io/ (репозиторий profsila/profsila.github.io)
# Перед публикацией проверяется банк заданий (node tools/bank.js check) и собирается
# архив для ведущих profsila.zip. На сайт выкладывается только папка game/.

name: Публикация игры

on:
  push:
    branches: ["claude/friendly-ride-vi6mi7"]
    paths: ["game/**", "tools/**", "package/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Проверка банка заданий
        run: node tools/bank.js check
      - name: Архив для ведущих
        run: python3 tools/package.py --out game/profsila.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - id: deployment
        uses: actions/deploy-pages@v4
